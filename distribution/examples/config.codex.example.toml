# Replace YOUR_NAME and node.exe path, or use installer-generated configuration.
[mcp_servers.agent]
command = "C:/Program Files/nodejs/node.exe"
args = ["C:/Users/YOUR_NAME/AppData/Local/Programs/Agent ACP MCP/dist/src/index.js"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers.agent.env]
# Persistent self-provider default: "true" allows host-provider calls in auto and explicit routing.
# "false" blocks by default. Per-call boolean override takes precedence; auto includes host when true.
ALLOW_SELF_PROVIDER = "false"
GROK_ENABLED = "true"
CLAUDE_ENABLED = "true"
CODEX_ENABLED = "true"
GROK_MODEL = "auto"
GROK_EFFORT = "auto"
CLAUDE_MODEL = "auto"
# auto means parent task-based selection; fixed values cannot be overridden by calls.
# Claude example levels: low, medium, high, xhigh, max (check agent_models).
# Actual support depends on model/CLI version. auto requires the parent to select and pass a supported effort.
CLAUDE_EFFORT = "auto"
CODEX_MODEL = "auto"
# Codex choices advertised by models/clients: low, medium, high, xhigh, max, ultra.
# Use only values supported by your selected model/client; auto requires a concrete parent selection and selection_reason.
# These env settings affect delegated CLI sessions, not the parent host's effort.
CODEX_EFFORT = "auto"
# Native Windows sandbox implementation: unelevated (default), elevated (requires setup).
CODEX_WINDOWS_SANDBOX = "unelevated"
# Implementation only: workspace-write (default), danger-full-access, read-only.
# Full access removes filesystem isolation; allowed_paths remains a task instruction.
CODEX_IMPLEMENT_SANDBOX = "workspace-write"
# New worktrees default to %USERPROFILE%/.agent-acp/worktrees.
# Optional absolute persistent root; existing TEMP worktrees are not migrated automatically.
# AGENT_MCP_WORKTREE_DIR = "D:/AgentWorktrees"
# The release includes portable PowerShell 7.6.6. Optional native PowerShell 7+ override:
# CODEX_POWERSHELL_PATH = "C:/Program Files/PowerShell/7/pwsh.exe"
# Explicit invalid/WindowsApps paths fail; Windows PowerShell 5.1 is not a fallback.
# Optional absolute paths when discovery fails:
# GROK_CLI = "C:/Users/YOUR_NAME/.grok/bin/grok.exe"
# CLAUDE_CLI = "C:/Users/YOUR_NAME/.local/bin/claude.exe"
# CODEX_CLI = "C:/Users/YOUR_NAME/AppData/Roaming/npm/codex.cmd"


# Optional per-call override: provider="codex", allow_self_provider=true/false.
# Use uppercase ALLOW_SELF_PROVIDER above for the persistent setting. Reconnect MCP after edits.



