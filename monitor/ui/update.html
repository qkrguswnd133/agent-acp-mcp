<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><link rel="stylesheet" href="update.css"><title>Agent ACP MCP 업데이트</title></head><body>
<main><header><div><h1>업데이트</h1><p>Agent ACP MCP · Agent Monitor</p></div><button id="check">지금 확인</button></header>
<section class="status"><span id="indicator"></span><div><strong id="status">확인 중</strong><p id="detail"></p></div></section>
<section><h2>설치된 버전</h2><div id="installed"></div><div id="last-result"></div></section>
<section><h2>최신 안정 릴리스</h2><div id="release"></div><div id="notes"></div><div class="actions"><button id="download" disabled>다운로드</button><button id="cancel" hidden>취소</button><button id="install" disabled>설치</button></div><progress id="progress" hidden></progress><p id="progress-label"></p></section>
<section><h2>GitHub 릴리스 기록</h2><div id="github-history" class="history"></div></section>
<section><h2>로컬 설치 기록</h2><div id="local-history" class="history"></div></section>
</main><script src="update.js"></script></body></html>
