<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"><link rel="stylesheet" href="style.css"><title>Agent 상세</title></head><body class="detail-body"><article class="detail">
<header><div class="identity"><span id="avatar">G</span><div><h1 id="name">Grok</h1><p id="connection">상태 확인 중</p></div></div><button id="refresh" class="icon-button" title="새로고침" aria-label="새로고침">↻</button></header>
<section class="usage"><div class="eyebrow">구독 사용량 <span id="quota-label"></span></div><div class="usage-line"><strong id="used">—</strong><span id="remaining">확인 중</span></div><div class="track"><div id="fill"></div></div><div class="reset-row"><span>초기화</span><span id="reset">확인 불가</span></div></section>
<section id="quota-windows" hidden aria-label="사용량 구간별 상세"></section>
<section class="settings" aria-label="최근 실행 설정"><div class="setting" id="model-row"><span class="setting-label">모델</span><div class="setting-body"><b id="model" class="setting-value" aria-describedby="model-detail">확인 불가</b><small id="model-status" class="setting-status"></small><dl id="model-compare" class="setting-compare" hidden><div><dt>요청</dt><dd id="model-requested"></dd></div><div><dt>실제</dt><dd id="model-actual"></dd></div></dl><i id="model-detail" class="sr-only"></i></div></div><div class="setting" id="effort-row"><span class="setting-label">Reasoning</span><div class="setting-body"><b id="effort" class="setting-value" aria-describedby="effort-detail">확인 불가</b><small id="effort-status" class="setting-status"></small><dl id="effort-compare" class="setting-compare" hidden><div><dt>요청</dt><dd id="effort-requested"></dd></div><div><dt>실제</dt><dd id="effort-actual"></dd></div></dl><i id="effort-detail" class="sr-only"></i></div></div><div class="setting" id="speed-row"><span class="setting-label">속도</span><div class="setting-body"><b id="speed" class="setting-value" aria-describedby="speed-detail">확인 불가</b><small id="speed-status" class="setting-status"></small><dl id="speed-compare" class="setting-compare" hidden><div><dt>요청</dt><dd id="speed-requested"></dd></div><div><dt>실제</dt><dd id="speed-actual"></dd></div></dl><i id="speed-detail" class="sr-only"></i></div></div></section>
<section class="facts"><div><span>로그인 / CLI</span><b id="auth">확인 중</b></div><div><span>CLI 계정</span><b id="account">확인 중</b></div><div id="organization-row" hidden><span>조직</span><b id="organization"></b></div></section>
<section class="activity"><div class="eyebrow">최근 작업 <span id="job-count"></span></div><div id="jobs"></div></section>
<footer><div><i id="fresh-dot"></i><span id="updated">첫 상태를 가져오는 중</span></div><p id="source">조회 중</p><p id="notice" role="status"></p></footer>
</article><script src="settings.js"></script><script src="detail.js"></script></body></html>
